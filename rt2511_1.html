<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <!-- 📱 모바일 화면 대응 필수 설정 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>가을 사냥</title>

  <!-- 🎨 외부 CSS 파일 연결 (이게 핵심) -->
  <link rel="stylesheet" href="style.css">
</head>


<body>

  <!-- 🎵 음악 버튼 -->
    <button id="musicToggleBtn">𝅘𝅥𝅮 정크야드 - 가을 사냥</button>

    <audio id="bgMusic" loop>
      <source src="images/music/정크야드 - 가을 사냥 feat. kite park.m4a" type="audio/mp4">
    </audio>

    <!-- ⬆ 맨 위로 버튼 -->
    <button id="scrollTopBtn">↑ top</button>


 <div class="container">
    <a href="random_thoughts.html" style="font-size: 14px;">back</a><br><br>

    <h1 style="text-align:center; margin-bottom: 0px;">가을 사냥</h1>
    <p style="text-align: center; color: gray; font-size: small;">2025.11</p><br><br>

    <div class="card">
      <img src="images/random_thoughts/rt2511_1/rt2511_1.JPEG" class="center-img" alt="?" width="300">
      <p></p><br><br>
      <img src="images/random_thoughts/rt2511_1/rt2511_2.JPG" class="center-img" alt="?" width="300">
      <p></p><br><br>
      <img src="images/random_thoughts/rt2511_1/rt2511_3.JPG" class="center-img" alt="?" width="300">
      <p></p><br><br>
      <img src="images/random_thoughts/rt2511_1/rt2511_4.JPG" class="center-img" alt="?" width="300">
      <p></p><br><br>
      <img src="images/random_thoughts/rt2511_1/rt2511_5.JPG" class="center-img" alt="?" width="300">
      <p></p><br><br>
      <img src="images/random_thoughts/rt2511_1/rt2511_6.JPG" class="center-img" alt="?" width="300">
      <p></p><br><br>
      
     
    </div>
    

    <br><br><br><br><br><br>

  </div>

<script>
  const musicBtn = document.getElementById("musicToggleBtn");
  const music = document.getElementById("bgMusic");
  const scrollBtn = document.getElementById("scrollTopBtn");

  let isPlaying = false;

  // 🎵 음악 ON/OFF
  musicBtn.addEventListener("click", () => {
    if (isPlaying) {
      music.pause();
      musicBtn.textContent = "𝅘𝅥𝅮 정크야드 - 가을사냥 / off";
    } else {
      music.play();
      musicBtn.textContent = "𝅘𝅥𝅮 정크야드 - 가을사냥 / on";
    }
    isPlaying = !isPlaying;
  });

  // ⬆ 스크롤 감지해서 버튼 표시
  window.addEventListener("scroll", () => {
    if (window.scrollY > 200) {
      scrollBtn.style.display = "block";
    } else {
      scrollBtn.style.display = "none";
    }
  });

  // ⬆ 맨 위로 이동
  scrollBtn.addEventListener("click", () => {
    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  });
</script>


</body>
</html>
